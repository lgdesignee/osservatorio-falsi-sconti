name: Aggiorna i dati

# Ogni mattina scarica i dati dal sito dell'osservatorio e li salva qui, con le tabelle CSV.
on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica
        run: |
          curl -fsSL -A "osservatorio-falsi-sconti (GitHub Actions)" https://www.prezzinvista.it/falsi-sconti/dati.json -o data/falsi-sconti.json.nuovo
          python -c "import json,sys; d=json.load(open('data/falsi-sconti.json.nuovo')); sys.exit(0 if d.get('months') else 1)"
          mv data/falsi-sconti.json.nuovo data/falsi-sconti.json
          if curl -fsSL -A "osservatorio-falsi-sconti (GitHub Actions)" https://www.prezzinvista.it/falsi-sconti/black-friday-2026/prezzi.csv -o data/bf.nuovo && [ -s data/bf.nuovo ]; then
            mv data/bf.nuovo data/black-friday-2026-prezzi.csv
          else
            rm -f data/bf.nuovo
          fi
          python scripts/csv.py
      - name: Salva
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Dati del $(date -u +%Y-%m-%d)"
          git push
